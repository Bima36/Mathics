<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Mathics</title>
<style>
/* Layout: one phone-sized column. Home menu -> Tujuan / Materi (stepper) / Latihan (quiz). Fraction visuals are SVG orange slices. */
:root{
  --bg:#fdeed8; --card:#fff8ec; --ink:#4a2a20; --muted:#8a6455;
  --salmon:#e8957f; --salmon-soft:#f6c9ba; --yellow:#e8c96a; --yellow-soft:#f5e3a6;
  --good:#3f8f5a; --good-bg:#d9f0de; --bad:#b84a3a; --bad-bg:#fadbd3; --line:#efd3b4;
  --f-display:'Fredoka','Trebuchet MS',system-ui,sans-serif; --f-body:'Nunito','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#2b1b17; --card:#3a2620; --ink:#fbe7d6; --muted:#c9a493; --salmon:#e8957f; --salmon-soft:#6b3d33;
  --yellow:#e8c96a; --yellow-soft:#6b5a2a; --good:#7ed39a; --good-bg:#24432f; --bad:#ff9d8c; --bad-bg:#552824; --line:#55382f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#2b1b17; --card:#3a2620; --ink:#fbe7d6; --muted:#c9a493; --salmon:#e8957f; --salmon-soft:#6b3d33;
  --yellow:#e8c96a; --yellow-soft:#6b5a2a; --good:#7ed39a; --good-bg:#24432f; --bad:#ff9d8c; --bad-bg:#552824; --line:#55382f; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--f-body);margin:0;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-block:12px 96px}
.top{display:flex;align-items:center;gap:12px;min-height:44px}
.top h2{font:600 18px var(--f-display);margin:0;flex:1;min-width:0;text-wrap:balance}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--salmon);color:#fff;display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px}
h1,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h3{font-size:24px;line-height:1.2}
p{margin:0}
.card{background:var(--card);border-radius:22px;padding:20px;border:2px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:16px;margin-top:16px}
.eyebrow{font:600 12px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
/* home */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:20px 0 8px}
.hero h1{font-size:40px;line-height:1.05}
.hero .ribbon{background:var(--salmon);color:#fff;padding:4px 18px;border-radius:6px;font:600 17px var(--f-display);transform:rotate(-3deg)}
.menu{display:grid;gap:12px;margin-top:12px}
.menu button{display:flex;align-items:center;gap:14px;text-align:left;background:var(--yellow);color:#3b2412;border:0;border-radius:20px;padding:14px 18px;font:600 20px var(--f-display)}
.menu button small{display:block;font:600 13px var(--f-body);opacity:.8}
.menu svg{width:44px;height:44px;flex:none}
.best{text-align:center;color:var(--muted);font-weight:800;font-size:14px;margin-top:8px}
/* fraction */
.fr{display:inline-flex;flex-direction:column;align-items:center;line-height:1;font:600 1em var(--f-display);vertical-align:middle;min-width:1.1em}
.fr b{font-weight:600;padding:0 .15em .12em}
.fr i{display:block;width:100%;height:.09em;min-height:2px;background:currentColor;border-radius:2px}
.fr b:last-child{padding:.12em .15em 0}
.mixed{display:inline-flex;align-items:center;gap:.12em;font:600 1em var(--f-display)}
.big{font-size:64px}
.hl{background:var(--yellow);color:#3b2412;border-radius:8px;padding:0 .12em}
.hl2{background:var(--salmon);color:#fff;border-radius:8px;padding:0 .12em}
/* pie */
.pie{display:block;margin:0 auto;max-width:100%;height:auto}
.pie path,.pie circle.w{transition:fill .15s}
.pie .tap{cursor:pointer}
.row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:10px;font:600 16px var(--f-display)}
.step button{width:44px;height:44px;border-radius:50%;border:2px solid var(--salmon);background:var(--card);font:600 22px var(--f-display);color:var(--ink)}
.step span{min-width:2ch;text-align:center;font-size:22px}
.btn{border:0;border-radius:999px;background:var(--salmon);color:#fff;font:600 16px var(--f-display);padding:11px 22px;min-height:44px}
.btn.alt{background:var(--yellow);color:#3b2412}
.btn:disabled{opacity:.45;cursor:default}
.lab{display:flex;gap:12px;justify-content:center}
.lab div{flex:1;border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.35}
.lab .hl,.lab .hl2{padding:10px 12px;border-radius:14px}
.lab strong{display:block;font:600 16px var(--f-display)}
/* choices */
.choices{display:grid;gap:10px}
.choices.grid{grid-template-columns:repeat(2,1fr)}
.choice{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;text-align:left;min-height:56px;font-size:18px;font-weight:600}
.choice .k{flex:none;width:30px;height:30px;border-radius:50%;background:var(--salmon-soft);display:grid;place-items:center;font:600 14px var(--f-display)}
.choice .v{flex:1;min-width:0;display:flex;justify-content:center;font-size:26px}
.choice.txt .v{justify-content:flex-start;font-size:18px}
.choice.ok{background:var(--good-bg);border-color:var(--good)}
.choice.no{background:var(--bad-bg);border-color:var(--bad)}
.choice[disabled]{cursor:default}
.fb{border-radius:16px;padding:12px 16px;font-weight:600;background:var(--yellow-soft)}
.fb.ok{background:var(--good-bg);color:var(--good)} .fb.no{background:var(--bad-bg);color:var(--bad)}
.fb span{color:var(--ink);font-weight:400}
.fb[hidden]{display:none}
/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));background:var(--bg);border-top:2px solid var(--line)}
.nav .in{max-width:480px;margin:0 auto;display:flex;align-items:center;gap:12px}
.dots{flex:1;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--salmon);width:22px;border-radius:6px}
.dots i.done{background:var(--yellow)}
.list{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.list li{display:flex;gap:12px;align-items:center;background:var(--bg);border-radius:14px;padding:10px 14px}
.list li .fr{font-size:30px}
.goal::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;background:var(--salmon)}
.score{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.score .n{font:700 64px/1 var(--f-display);color:var(--salmon)}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--yellow);transition:width .3s}
.sim{display:flex;align-items:center;justify-content:center;gap:18px;font-size:48px;flex-wrap:wrap}
.arrow{font:600 14px var(--f-display);color:var(--muted);text-align:center;max-width:110px;line-height:1.3}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="app" id="app"></div>
<div class="nav" id="nav" hidden><div class="in" id="navin"></div></div>

<script>
const $=s=>document.querySelector(s);
const app=$('#app'), nav=$('#nav'), navin=$('#navin');
const fr=(a,b,cls='')=>`<span class="fr ${cls}"><b>${a}</b><i></i><b>${b}</b></span>`;
const mixed=(w,a,b)=>`<span class="mixed">${w}${fr(a,b)}</span>`;
const gcd=(a,b)=>b?gcd(b,a%b):a;
const ICON={
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>'
};
/* ---------- storage (optional) ---------- */
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- pie drawing ---------- */
function pie(n,taken,{size=170,kind='orange',tap=false,label=false}={}){
  const R=size/2-6,c=size/2,peel=kind==='pizza'?'#d9663a':'var(--salmon)';
  let out=`<svg class="pie" viewBox="0 0 ${size} ${size}" width="${size}" role="img" aria-label="Lingkaran dibagi ${n} bagian, ${taken.size??taken} diambil">`;
  out+=`<circle cx="${c}" cy="${c}" r="${R+4}" fill="${peel}"/>`;
  const has=i=>taken instanceof Set?taken.has(i):i<taken;
  const pt=(a,r)=>[c+r*Math.cos(a),c+r*Math.sin(a)];
  for(let i=0;i<n;i++){
    const fill=has(i)?'var(--yellow)':'var(--yellow-soft)';
    const cls=tap?'tap':'';
    if(n===1){out+=`<circle class="w ${cls}" data-i="0" cx="${c}" cy="${c}" r="${R}" fill="${fill}"/>`;continue}
    const a0=-Math.PI/2+i*2*Math.PI/n,a1=-Math.PI/2+(i+1)*2*Math.PI/n;
    const [x0,y0]=pt(a0,R),[x1,y1]=pt(a1,R);
    out+=`<path class="${cls}" data-i="${i}" d="M${c} ${c}L${x0} ${y0}A${R} ${R} 0 ${a1-a0>Math.PI?1:0} 1 ${x1} ${y1}Z" fill="${fill}" stroke="var(--card)" stroke-width="2.5" stroke-linejoin="round"/>`;
    if(kind==='orange'){const [dx,dy]=pt((a0+a1)/2,R*.55);out+=`<circle cx="${dx}" cy="${dy}" r="2.5" fill="${peel}" opacity=".55" pointer-events="none"/>`}
  }
  return out+'</svg>';
}

/* ---------- reusable: choice list ---------- */
function mountChoices(root,opts,{grid=false,txt=false,onPick}){
  const wrap=document.createElement('div');wrap.className='choices'+(grid?' grid':'')+(txt?' txt':'');
  opts.forEach((o,i)=>{
    const b=document.createElement('button');b.className='choice'+(txt?' txt':'');
    b.innerHTML=`<span class="k">${'ABCD'[i]}</span><span class="v">${o.html}</span>`;
    b.onclick=()=>{
      if(wrap.dataset.done)return;wrap.dataset.done=1;
      [...wrap.children].forEach((c,j)=>{c.disabled=true;if(opts[j].ok)c.classList.add('ok')});
      if(!o.ok)b.classList.add('no');
      onPick&&onPick(o.ok,i);
    };
    wrap.appendChild(b);
  });
  root.appendChild(wrap);return wrap;
}
const feedback=(ok,exp)=>`<b>${ok?'Benar!':'Belum tepat.'}</b> <span>${exp}</span>`;

/* ---------- interactive explorer: split + take slices ---------- */
function explorer(root,{labels=false,n=5,taken=new Set([0]),kind='orange'}={}){
  root.innerHTML=`<div data-pie></div>
    <div class="row" style="margin-top:12px">
      <div class="step"><span style="font-size:14px">Dibagi</span><button data-m aria-label="Kurangi bagian">−</button><span data-n></span><button data-p aria-label="Tambah bagian">+</button><span style="font-size:14px">bagian</span></div>
    </div>
    <div class="sim" style="margin:10px 0 4px" data-f></div>
    ${labels?`<div class="lab"><div class="hl2"><strong>Pembilang</strong>bagian yang diambil, letaknya di atas.</div><div class="hl"><strong>Penyebut</strong>bagian seluruhnya, letaknya di bawah.</div></div>`:''}
    <p style="text-align:center;color:var(--muted);font-weight:700;font-size:14px;margin-top:8px">Ketuk potongan untuk mengambil atau mengembalikannya.</p>`;
  const draw=()=>{
    taken.forEach(i=>{if(i>=n)taken.delete(i)});
    root.querySelector('[data-pie]').innerHTML=pie(n,taken,{tap:true,kind});
    root.querySelector('[data-n]').textContent=n;
    const k=taken.size;
    root.querySelector('[data-f]').innerHTML=labels?
      `<span class="fr"><b class="hl2">${k}</b><i></i><b class="hl">${n}</b></span>`:fr(k,n);
    root.querySelectorAll('.tap').forEach(el=>el.onclick=()=>{const i=+el.dataset.i;taken.has(i)?taken.delete(i):taken.add(i);draw()});
  };
  root.querySelector('[data-m]').onclick=()=>{if(n>1){n--;draw()}};
  root.querySelector('[data-p]').onclick=()=>{if(n<12){n++;draw()}};
  draw();
}

/* ---------- screens ---------- */
let state={screen:'home',step:0};
function frame(title,body,{back='home'}={}){
  app.innerHTML=`<div class="top"><button class="iconbtn" id="bk" aria-label="Kembali ke beranda">${ICON.home}</button><h2>${title}</h2></div>${body}`;
  $('#bk').onclick=()=>go('home');
  window.scrollTo(0,0);
}
function go(screen,step=0){state={screen,step};nav.hidden=true;({home,tujuan,materi,latihan})[screen]();}

function pieSmall(){
  let s='<circle cx="22" cy="22" r="20" fill="#e8957f"/>';
  for(let i=0;i<6;i++){const a0=-Math.PI/2+i*Math.PI/3,a1=a0+Math.PI/3,r=16;
    s+=`<path d="M22 22L${22+r*Math.cos(a0)} ${22+r*Math.sin(a0)}A${r} ${r} 0 0 1 ${22+r*Math.cos(a1)} ${22+r*Math.sin(a1)}Z" fill="${i===0?'#e8c96a':'#f5e3a6'}" stroke="#fff8ec" stroke-width="1.5"/>`}
  return s;
}

function tujuan(){
  frame('Tujuan Pembelajaran',`<div class="stack">
    <div class="card"><ul class="list">
      <li class="goal">Memahami apa itu pecahan.</li>
      <li class="goal">Mengidentifikasi bagian-bagian dari pecahan.</li>
      <li class="goal">Membedakan jenis-jenis pecahan.</li>
      <li class="goal">Menyederhanakan pecahan.</li></ul></div>
    <div class="card"><div class="eyebrow">Ayo berpikir!</div>
      <p style="margin:6px 0 12px;font-weight:600">Sebuah pizza dibagi menjadi 4 bagian sama besar. Jika kamu mengambil 1 bagian, berapa bagian pizza yang kamu ambil?</p>
      ${pie(4,new Set([0]),{kind:'pizza',size:150})}
      <div id="q" style="margin-top:14px"></div>
      <div class="fb" id="fb" hidden style="margin-top:12px"></div></div>
    <button class="btn" id="mulai" style="align-self:center">Mulai belajar materi</button></div>`);
  mountChoices($('#q'),[
    {html:fr(1,2)},{html:fr(1,4),ok:true},{html:fr(3,4)},{html:fr(4,1)}],
    {grid:true,onPick:ok=>{const f=$('#fb');f.hidden=false;f.className='fb '+(ok?'ok':'no');
      f.innerHTML=feedback(ok,`Pizza dibagi 4 sama besar dan kamu ambil 1, jadi kamu mengambil ${fr(1,4)} pizza.`)}});
  $('#mulai').onclick=()=>go('materi');
}

const LESSONS=[
 {t:'Pertanyaan Interaktif',r(el){
   el.innerHTML=`<div class="card"><p style="font-weight:600;margin-bottom:10px">Berapa banyak potongan jeruk yang kamu lihat di gambar ini?</p>${pie(5,0,{size:190})}<div id="q" style="margin-top:14px"></div><div class="fb" id="fb" hidden style="margin-top:12px"></div></div>`;
   mountChoices($('#q'),[{html:'2 potong'},{html:'5 potong',ok:true},{html:'6 potong'}],{txt:true,onPick:ok=>{
     const f=$('#fb');f.hidden=false;f.className='fb '+(ok?'ok':'no');
     f.innerHTML=feedback(ok,'Jawabannya 5 potong. Kita membagi jeruk menjadi 5 bagian sama besar. Itu adalah contoh pecahan!')}});
 }},
 {t:'Apa Itu Pecahan?',r(el){
   el.innerHTML=`<div class="card"><h3>Apa itu pecahan?</h3><p style="margin:8px 0 14px">Pecahan adalah cara untuk menunjukkan bagian dari keseluruhan. Misalnya, jika kita membagi sebuah jeruk menjadi 5 bagian yang sama, dan kita makan 1 bagian, kita makan ${fr(1,5)} dari jeruk.</p><div id="ex"></div></div>`;
   explorer($('#ex'),{n:5,taken:new Set([0])});
 }},
 {t:'Bagian-Bagian Pecahan',r(el){
   el.innerHTML=`<div class="card"><h3>Bagian-bagian pecahan</h3><p style="margin:8px 0 14px">Pecahan punya dua bagian: pembilang di atas dan penyebut di bawah. Ubah jumlah potongan dan lihat angkanya berubah.</p><div id="ex"></div></div>`;
   explorer($('#ex'),{labels:true,n:2,taken:new Set([0]),kind:'pizza'});
 }},
 {t:'Cara Membaca Pecahan',r(el){
   el.innerHTML=`<div class="card"><h3>Cara membaca pecahan</h3><p style="margin:8px 0 14px">Bacalah pembilang terlebih dahulu, kemudian penyebutnya. Ketuk sebuah pecahan untuk melihat cara membacanya.</p>
   <div class="row" id="pick"></div><div class="sim" id="shown" style="margin-top:14px"></div><p id="say" style="text-align:center;font:600 22px var(--f-display);min-height:34px"></p></div>`;
   const ex=[[1,2,'satu per dua'],[3,4,'tiga per empat'],[5,6,'lima per enam']];
   const show=i=>{const [a,b,t]=ex[i];$('#shown').innerHTML=fr(a,b);$('#say').textContent='dibaca "'+t+'"';
     [...$('#pick').children].forEach((c,j)=>c.className='btn'+(j===i?'':' alt'))};
   ex.forEach(([a,b],i)=>{const bt=document.createElement('button');bt.innerHTML=`<span style="font-size:22px">${fr(a,b)}</span>`;bt.style.padding='8px 20px';bt.onclick=()=>show(i);$('#pick').appendChild(bt)});
   show(0);
 }},
 {t:'Jenis-Jenis Pecahan',r(el){
   el.innerHTML=`<div class="stack" style="margin:0">
   <div class="card"><div class="eyebrow">Jenis pertama</div><h3>Pecahan biasa</h3><p style="margin:8px 0 12px">Bentuknya ${fr('a','b')}, yaitu dua bilangan bulat yang dipisahkan sebuah garis lurus.</p>
     <div class="sim" style="font-size:34px;background:var(--bg);border-radius:16px;padding:12px">${fr(1,2)}${fr(3,4)}${fr(1,4)}${fr(2,2)}</div></div>
   <div class="card"><div class="eyebrow">Jenis kedua</div><h3>Pecahan campuran</h3><p style="margin:8px 0 12px">Gabungan bilangan bulat dengan pecahan biasa. Bilangan bulat berada sebelum pecahan biasa.</p>
     <div class="sim" style="font-size:34px;background:var(--bg);border-radius:16px;padding:12px">${mixed(1,1,2)}${mixed(2,3,4)}${mixed(3,1,2)}</div></div></div>`;
 }},
 {t:'Menyederhanakan Pecahan',r(el){
   el.innerHTML=`<div class="card"><h3>Menyederhanakan pecahan</h3><p style="margin:8px 0 14px">Kurangi pecahan menjadi bentuk yang lebih mudah dipahami. Bagilah pembilang dan penyebut dengan bilangan yang sama (2, 3, 5, 7, dan seterusnya) sampai tidak bisa dibagi lagi.</p>
   <div class="eyebrow" style="text-align:center">Pilih contoh</div><div class="row" id="pick" style="margin:8px 0 14px"></div>
   <div class="sim" id="sim"></div><div class="row" style="margin-top:14px"><button class="btn" id="go">Sederhanakan</button><button class="btn alt" id="rs">Ulangi</button></div><p id="msg" style="text-align:center;margin-top:12px;font-weight:600;min-height:28px"></p></div>`;
   const ex=[[4,8],[6,12],[2,4],[9,12]];let cur=0,a,b;
   const draw=()=>{const g=gcd(a,b);
     $('#sim').innerHTML=fr(a,b)+(a===ex[cur][0]&&g>1?'':'')+'';
     $('#go').disabled=g===1;
     $('#msg').textContent=g===1?'Sudah paling sederhana, tidak bisa dibagi lagi.':'';};
   const set=i=>{cur=i;[a,b]=ex[i];[...$('#pick').children].forEach((c,j)=>c.className='btn'+(j===i?'':' alt'));
     $('#sim').innerHTML=fr(a,b);$('#go').disabled=false;$('#msg').textContent='';};
   ex.forEach(([x,y],i)=>{const bt=document.createElement('button');bt.innerHTML=`<span style="font-size:20px">${fr(x,y)}</span>`;bt.style.padding='6px 16px';bt.onclick=()=>set(i);$('#pick').appendChild(bt)});
   $('#go').onclick=()=>{const g=gcd(a,b);const na=a/g,nb=b/g;
     $('#sim').innerHTML=`${fr(a,b)}<span class="arrow">pembilang dan penyebut dibagi ${g}</span>${fr(na,nb)}`;
     a=na;b=nb;$('#go').disabled=true;$('#msg').textContent='Sudah paling sederhana, tidak bisa dibagi lagi.'};
   $('#rs').onclick=()=>set(cur);
   set(0);
 }}
];
function materi(){
  const i=state.step,L=LESSONS[i];
  frame(`Materi · ${L.t}`,`<div class="stack" style="margin-top:12px"><div id="lesson"></div></div>`);
  L.r($('#lesson'));
  nav.hidden=false;
  navin.innerHTML=`<button class="btn alt" id="pv" ${i===0?'disabled':''}>Kembali</button><div class="dots">${LESSONS.map((_,j)=>`<i class="${j===i?'on':j<i?'done':''}"></i>`).join('')}</div><button class="btn" id="nx">${i===LESSONS.length-1?'Latihan':'Lanjut'}</button>`;
  $('#pv').onclick=()=>{state.step--;materi()};
  $('#nx').onclick=()=>i===LESSONS.length-1?go('latihan'):(state.step++,materi());
}

/* ---------- Latihan ---------- */
const QUIZ=[
 {q:'Manakah yang merupakan pecahan dengan pembilang 3?',o:[fr(3,4),fr(4,3),fr(2,3),fr(5,3)],a:0,e:`Pembilang ada di atas. Pecahan ${fr(3,4)} punya pembilang 3.`},
 {q:'Sederhanakan pecahan 6/12.',o:[fr(2,3),fr(1,2),fr(3,4),fr(5,6)],a:1,e:`Bagi pembilang dan penyebut dengan 6, hasilnya ${fr(1,2)}.`},
 {q:'Manakah yang menggambarkan pecahan 3/5?',pies:[[8,3],[2,1],[5,2],[5,3]],a:3,e:`Gambar dengan 5 potongan sama besar dan 3 potongan diambil menunjukkan ${fr(3,5)}.`},
 {q:'Berapa 2/4 jika disederhanakan?',o:[fr(1,2),fr(1,4),fr(2,3),fr(3,4)],a:0,e:`Bagi pembilang dan penyebut dengan 2, hasilnya ${fr(1,2)}.`},
 {q:'Pecahan mana yang menunjukkan satu bagian dari lima bagian?',o:[fr(1,4),fr(1,2),fr(1,3),fr(1,5)],a:3,e:`Satu bagian dari lima bagian ditulis ${fr(1,5)}.`}
];
function latihan(){
  state={screen:'latihan',step:0,score:0};
  question();
}
function question(){
  const i=state.step,Q=QUIZ[i];
  frame(`Latihan Soal ${i+1} dari ${QUIZ.length}`,`<div class="stack" style="margin-top:12px">
    <div class="bar" aria-hidden="true"><i style="width:${i/QUIZ.length*100}%"></i></div>
    <div class="card"><p style="font:600 20px/1.35 var(--f-display);margin-bottom:16px">${Q.q}</p><div id="q"></div></div>
    <div class="fb" id="fb" hidden></div></div>`);
  const opts=Q.pies?Q.pies.map((p,j)=>({html:pie(p[0],p[1],{size:84}),ok:j===Q.a})):Q.o.map((h,j)=>({html:h,ok:j===Q.a}));
  nav.hidden=false;
  navin.innerHTML=`<div class="dots">${QUIZ.map((_,j)=>`<i class="${j===i?'on':j<i?'done':''}"></i>`).join('')}</div><button class="btn" id="nx" disabled>${i===QUIZ.length-1?'Lihat skor':'Soal berikutnya'}</button>`;
  mountChoices($('#q'),opts,{grid:true,onPick:ok=>{
    if(ok)state.score++;
    const f=$('#fb');f.hidden=false;f.className='fb '+(ok?'ok':'no');f.innerHTML=feedback(ok,Q.e);
    $('#nx').disabled=false;}});
  $('#nx').onclick=()=>{if(i===QUIZ.length-1)result();else{state.step++;question()}};
}
function result(){
  const s=state.score,tot=QUIZ.length;
  const prev=+(store.get('pecahan-best')??-1);if(s>prev)store.set('pecahan-best',s);
  const msg=s===tot?'Sempurna! Kamu paham dasar pecahan.':s>=3?'Bagus! Sedikit lagi sempurna.':'Ayo pelajari materinya sekali lagi, lalu coba lagi.';
  frame('Hasil Latihan',`<div class="stack"><div class="card score"><div class="eyebrow">Skormu</div><div class="n">${s}<span style="font-size:28px;color:var(--muted)"> / ${tot}</span></div>
    <div aria-hidden="true">${pie(tot,s,{size:130})}</div><p style="font-weight:600">${msg}</p>
    <div class="row"><button class="btn" id="again">Coba lagi</button><button class="btn alt" id="rev">Buka materi</button></div></div>
    <p style="text-align:center;font:600 18px var(--f-display)">Terima kasih sudah belajar!</p></div>`);
  nav.hidden=true;
  $('#again').onclick=()=>go('latihan');$('#rev').onclick=()=>go('materi');
}
home();
</script>
